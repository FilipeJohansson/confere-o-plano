name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Citações conferem com o texto do PDF
        run: pnpm validar

      - name: Checagem de tipos
        run: pnpm exec astro check

      - name: Testes unitários
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Instala o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes no navegador (inclui 10 execuções aleatórias por tela)
        run: pnpm exec playwright test

      - name: Relatório dos testes no navegador (com o log das escolhas em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
